name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: API and SQLite
        run: python -m pytest tests/test_api.py tests/test_database.py -q
      - name: Browser scenarios
        run: python -m pytest tests/test_ui.py -q
